name: release

# タグ push（v*）で macOS / Windows のバイナリをビルドし、GitHub Releases に添付する。
# 各 OS はそれぞれの runner 上でネイティブにビルドするため、クロスコンパイルの罠を避けられる。
# SQLite はピュア Go の modernc.org/sqlite を使うため cgo の C コンパイラ依存はない。
#
# 供給網対策（監査 a6f2706 #24 #25 #27 #43 #44）:
# - ワークフローの既定権限は read。contents:write は公開ジョブ（release）だけに付ける。
# - checkout は persist-credentials: false で、トークンを .git/config に残さない。
# - action はすべてコミット SHA に固定する（コメントは対応するタグ）。
# - Wails CLI は go.mod の github.com/wailsapp/wails/v2 と同じ版を入れる。
# - npm 依存は lockfile どおり `npm ci --ignore-scripts` で入れ、ライフサイクルスクリプトを動かさない。
#   wails.json の frontend:install（npm install）は通らないよう `wails build -s` を使う。
# - ビルドはテスト（test.yml）が通ってから。公開ジョブは成果物を artifact 経由で受け取るだけで、
#   ソースの checkout もビルドもしない。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: test
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  build:
    name: build (${{ matrix.artifact }})
    needs: test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: ssh-gete-macos-universal
          - os: windows-latest
            platform: windows/amd64
            artifact: ssh-gete-windows-amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install Wails CLI (version from go.mod)
        run: |
          WAILS_VERSION="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          echo "wails ${WAILS_VERSION}"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"

      # frontend/wailsjs は生成物（git 管理外）。フロントエンドのビルドが import するので先に作る。
      # main.go の go:embed が frontend/dist を要求するため、空のディレクトリを用意しておく。
      - name: Generate Wails bindings
        run: |
          mkdir -p frontend/dist && touch frontend/dist/.keep
          wails generate module

      - name: Install frontend dependencies (no lifecycle scripts)
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # -s: フロントエンドの install / build を飛ばす（上で済ませている）。
      - name: Build
        run: wails build -s -platform ${{ matrix.platform }} -clean -trimpath

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          ditto -c -k --sequesterRsrc --keepParent ssh-gete.app "../../${{ matrix.artifact }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/bin/ssh-gete.exe -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # 書き込み権限はこのジョブだけ。ここではソースを checkout せず、第三者のビルドコードも動かさない。
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- *.zip | tee SHA256SUMS.txt

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
