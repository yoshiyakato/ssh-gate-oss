name: test

# action はコミット SHA に固定する（コメントは対応するタグ）。監査 a6f2706 #25 #43。
# release.yml からも workflow_call で呼ばれ、テストが通ったときだけリリースのビルドに進む（#27）。

on:
  push:
    branches: ['**']
  pull_request: {}
  workflow_call: {}

permissions:
  contents: read

env:
  # govulncheck の版を固定する（#26 #45）。
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # main.go embeds frontend/dist; tests only need the directory to exist.
      - name: Stub frontend dist
        shell: bash
        run: mkdir -p frontend/dist && touch frontend/dist/.keep
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # Run govulncheck natively on every OS so that Windows-only
      # (ssh_agent_windows.go / go-winio / go-webview2) and darwin-only code
      # paths are analysed too, not just GOOS=linux (#26 #45).
      - name: govulncheck
        shell: bash
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # frontend/wailsjs is generated (and git-ignored); the build and the
      # tests import it, so generate it from the Go bindings first.
      # The Wails CLI version follows github.com/wailsapp/wails/v2 in go.mod.
      - name: Generate Wails bindings
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          mkdir -p frontend/dist && touch frontend/dist/.keep
          WAILS_VERSION="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"
          wails generate module -tags webkit2_41
      # No dependency in package-lock.json needs a lifecycle script to build:
      # rolldown / lightningcss ship native code as per-platform optional
      # packages, and the only hasInstallScript entry (fsevents, darwin-only,
      # optional) ships a prebuilt fsevents.node (#44).
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      # npm dependency audit (#54). Non-blocking until vite is bumped to
      # >= 8.1.6 in package-lock.json; drop continue-on-error after that.
      - name: npm audit
        continue-on-error: true
        run: npm audit --audit-level=high
