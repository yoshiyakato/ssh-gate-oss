# docker compose の例（docs/headless.md「Docker」）。
#
#   docker compose -f deploy/docker/compose.example.yaml up -d
#   docker compose -f deploy/docker/compose.example.yaml run --rm ssh-gete --print-admin-token
#
# config.yaml は deploy/headless.example.yaml を元に作り、次を入れる:
#   secrets.backend: env           （または file → /data/secrets.json。コンテナにキーチェーンは無い）
# Web の待受と TLS は下の command で決まる（--listen / --tls-self-signed は web.listen / web.tls より優先）。
# MCP の待受はイメージの SSH_GETE_MCP_ADDR=0.0.0.0:8787 で決まり、config.yaml の mcp.listenAddress /
# mcp.port は使われない。0.0.0.0 なので Bearer（SSH_GETE_TOKEN）が必須になる。
# config.yaml は group / other に書き込み権があると起動を拒否する（chmod 0640 か 0600 にする）。
services:
  ssh-gete:
    image: ssh-gete:headless
    restart: unless-stopped
    # イメージの既定の CMD は設定ファイルなしで動く。設定ファイルを使うので書き直す。
    command: ["--config", "/config/config.yaml", "--listen", "0.0.0.0:8788", "--tls-self-signed"]
    ports:
      # ホストのループバックにだけ公開する。LAN に出すときは 0.0.0.0 に変える。
      - "127.0.0.1:8788:8788"
      - "127.0.0.1:8787:8787"
    volumes:
      - ssh-gete-data:/data
      - ./config.yaml:/config/config.yaml:ro
      - ./keys:/config/keys:ro
    environment:
      # MCP の Bearer。値は .env などから渡し、compose ファイルには書かない。
      SSH_GETE_TOKEN: ${SSH_GETE_TOKEN:?set SSH_GETE_TOKEN}
      # config.yaml の passwordEnv: PROD_WEB_1_PASSWORD に対応
      PROD_WEB_1_PASSWORD: ${PROD_WEB_1_PASSWORD:-}
    stop_grace_period: 30s

volumes:
  ssh-gete-data: {}
